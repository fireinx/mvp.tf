<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MVP · logs.tf</title>
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
<script src="/vendor/react.min.js"></script>
<script src="/vendor/react-dom.min.js"></script>
<script src="/vendor/babel.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0f0f0f;color:#aaa;font-family:'DM Mono','Courier New',monospace;min-height:100vh}
  input{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:4px;padding:10px 14px;font-size:14px;font-family:inherit;color:#e8e8e8;outline:none;transition:border-color .15s;width:100%}
  input:focus{border-color:#3a3a3a}
  .btn-go{background:#e8e8e8;color:#0f0f0f;border:none;border-radius:4px;font-family:inherit;font-size:14px;font-weight:500;padding:10px 20px;cursor:pointer;transition:background .15s;flex-shrink:0}
  .btn-go:hover:not(:disabled){background:#ccc}
  .btn-go:disabled{opacity:.4;cursor:not-allowed}
  .vbtn{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:3px;color:#aaa;font-family:inherit;font-size:12px;font-weight:500;padding:3px 10px;cursor:pointer;flex-shrink:0;transition:all .1s}
  .vbtn:hover:not(:disabled){background:#e8e8e8;color:#0f0f0f;border-color:#e8e8e8}
  .vbtn.voted{background:#e8e8e8;color:#0f0f0f;border-color:#e8e8e8}
  .vbtn:disabled{color:#2a2a2a;border-color:#1e1e1e;cursor:not-allowed}
  ::-webkit-scrollbar{width:4px}
  ::-webkit-scrollbar-track{background:#0f0f0f}
  ::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:2px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useCallback } = React;
const MAX_VOTES = 3;
// SESSION_ID persists across refreshes so the same browser can't vote twice
function getSessionId() {
  let sid = localStorage.getItem('sid');
  if (!sid) { sid = Math.random().toString(36).slice(2, 18); localStorage.setItem('sid', sid); }
  return sid;
}
const SESSION_ID = getSessionId();

const CLASS_SHORT = {
  scout:'Scout', soldier:'Solly', pyro:'Pyro', demoman:'Demo',
  heavyweapons:'Heavy', engineer:'Engi', medic:'Medic', sniper:'Sniper', spy:'Spy'
};

function parseLogId(s) {
  const m = s.trim().match(/(\d{5,8})/);
  return m ? m[1] : null;
}

// logs.tf API zwraca Steam3 [U:1:XXXXXXX] — konwertujemy do Steam64
function toSteam64(id) {
  if (/^\d{17}$/.test(id)) return id;
  const m = String(id).match(/\[U:1:(\d+)\]/);
  if (m) return (BigInt('76561197960265728') + BigInt(m[1])).toString();
  return id;
}

function topClass(stats) {
  if (!stats?.length) return '';
  const t = stats.reduce((a,b) => a.total_time > b.total_time ? a : b);
  return CLASS_SHORT[t.type] || t.type || '';
}

async function fetchLog(logId) {
  // Proxy przez Vercel function — bez CORS problemów
  const res = await fetch(`/api/log?id=${logId}`);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const data = await res.json();
  if (!data.success) throw new Error('Log not found');
  return data;
}

function storageGet(key) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; } catch { return null; }
}
function storageSet(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
}
function addRecentLog(id, info) {
  const list = storageGet('recent') || [];
  const filtered = list.filter(x => x.id !== id);
  filtered.unshift({ id, map: info?.map || '', title: info?.title || '', ts: Date.now() });
  storageSet('recent', filtered.slice(0, 5));
}

function timeAgo(ts) {
  if (!ts) return '';
  const min = Math.floor((Date.now() - ts) / 60000);
  if (min < 1)  return 'just now';
  if (min < 60) return `${min}m ago`;
  const h = Math.floor(min / 60);
  if (h < 24)   return `${h}h ago`;
  return `${Math.floor(h / 24)}d ago`;
}

// Toast — mały komunikat zamiast alert()
function useToast() {
  const [msg, setMsg] = useState('');
  const show = (text, ms = 2000) => {
    setMsg(text);
    setTimeout(() => setMsg(''), ms);
  };
  const Toast = msg ? (
    <div style={{position:'fixed', bottom:24, left:'50%', transform:'translateX(-50%)',
      background:'#1a1a1a', border:'1px solid #2a2a2a', borderRadius:4,
      color:'#e8e8e8', fontSize:12, padding:'8px 16px', pointerEvents:'none', zIndex:999}}>
      {msg}
    </div>
  ) : null;
  return { show, Toast };
}

function PlayerRow({ p, votes, myVotes, votesLeft, votingOpen, onVote, accent }) {
  const voted = myVotes.includes(p.id);
  const cnt = votes[p.id] || 0;
  const can = votingOpen && votesLeft > 0 && !voted;
  return (
    <div style={{
      display:'flex', alignItems:'center', gap:8,
      padding:'7px 0 7px 8px',
      borderBottom:'1px solid #1a1a1a',
      borderLeft: voted ? `2px solid ${accent}` : '2px solid transparent'
    }}>
      <div style={{flex:1, minWidth:0}}>
        <a href={`https://logs.tf/profile/${toSteam64(p.id)}`} target="_blank" rel="noopener noreferrer"
          style={{fontSize:13, fontWeight:500, color:'#e8e8e8', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis', display:'block', textDecoration:'none'}}
          onMouseEnter={e=>e.target.style.textDecoration='underline'} onMouseLeave={e=>e.target.style.textDecoration='none'}
        >{p.name}</a>
        <div style={{fontSize:10, color:'#777', marginTop:2}}>{[p.cls, `${p.k}/${p.d}`, p.dpm ? `${p.dpm}dpm` : ''].filter(Boolean).join(' · ')}</div>
      </div>
      {cnt > 0 && <span style={{fontSize:13, fontWeight:500, color:'#e8e8e8', minWidth:16, textAlign:'right'}}>{cnt}</span>}
      <button className={`vbtn${voted ? ' voted' : ''}`} onClick={() => onVote(p.id, p.name)} disabled={!can}>
        {voted ? '✓' : '+1'}
      </button>
    </div>
  );
}

const _params = new URLSearchParams(window.location.search);
// ?admin=SECRET — panel admina
const ADMIN_SECRET = _params.get('admin') || '';
// ?open — bypass limitu czasowego dla wszystkich (admin udostępnia link)
const URL_OPEN = _params.has('open');
// ?log=ID — bezpośredni link do lobby
const URL_LOG = _params.get('log') || '';

async function adminFetch(action, extra = {}) {
  const r = await fetch('/api/admin', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action, secret: ADMIN_SECRET, ...extra }),
  });
  return r.json();
}

// Subkomponent: lista graczy danego rankingu z przyciskami remove
function AdminRankingPlayers({ rows, onRemove, onClearAll, actionLabel }) {
  const [removed, setRemoved] = useState(new Set());
  const [confirmClear, setConfirmClear] = useState(false);
  const btnR = { background:'transparent', border:'1px solid #3a1a1a', color:'#f87171', borderRadius:3, fontSize:10, padding:'2px 7px', cursor:'pointer' };
  const btnN = { background:'transparent', border:'1px solid #2a2a2a', color:'#555', borderRadius:3, fontSize:10, padding:'2px 7px', cursor:'pointer' };
  const visible = rows.filter(r => !removed.has(r.steam_id));
  return (
    <div>
      {visible.length === 0 && <div style={{fontSize:11, color:'#333', padding:'4px 0'}}>no players yet</div>}
      {visible.map(row => (
        <div key={row.steam_id} style={{display:'flex', alignItems:'center', gap:8, padding:'4px 0', borderBottom:'1px solid #161616'}}>
          <span style={{flex:1, fontSize:11, color:'#e8e8e8', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{row.name || row.steam_id}</span>
          <span style={{fontSize:10, color:'#555'}}>{row.total_votes}pts</span>
          <button style={btnR} onClick={() => { setRemoved(s => new Set([...s, row.steam_id])); onRemove(row.steam_id); }}>remove</button>
        </div>
      ))}
      {onClearAll && (
        <div style={{marginTop:8}}>
          {!confirmClear
            ? <button style={btnR} onClick={() => setConfirmClear(true)}>{actionLabel || 'clear all'}</button>
            : <><button style={{...btnR, background:'#7f1d1d'}} onClick={() => { onClearAll(); setConfirmClear(false); }}>confirm</button>
               <button style={{...btnN, marginLeft:6}} onClick={() => setConfirmClear(false)}>cancel</button></>
          }
        </div>
      )}
    </div>
  );
}

// Panel na stronie głównej: global recent + contests + rankingi z tabami
function AdminHomePanel({ leaderboard, onRefreshLeaderboard, globalRecent, onRefreshRecent, contests, onRefreshContests, onLoadLog }) {
  const [status, setStatus] = useState('');
  const [newContestName, setNewContestName] = useState('');
  const [playersTab, setPlayersTab] = useState('hof'); // 'hof' | contest.id
  const [contestPlayers, setContestPlayers] = useState({}); // {contestId: rows[]}

  const btnStyle = (danger, active) => ({
    background: active ? (danger ? '#7f1d1d' : '#e8e8e8') : 'transparent',
    color: active ? (danger ? '#fca5a5' : '#0f0f0f') : (danger ? '#f87171' : '#555'),
    border: `1px solid ${active ? (danger?'#7f1d1d':'#e8e8e8') : (danger?'#3a1a1a':'#2a2a2a')}`,
    borderRadius:3, fontSize:10, padding:'2px 7px', cursor:'pointer', flexShrink:0,
  });

  const fetchContestPlayers = async (cid) => {
    try {
      const r = await fetch(`/api/leaderboard?limit=50&contest=${cid}`);
      if (r.ok) {
        const data = await r.json();
        setContestPlayers(p => ({ ...p, [cid]: data }));
      }
    } catch {}
  };

  const act = async (action, extra = {}) => {
    setStatus('…');
    try {
      const j = await adminFetch(action, extra);
      if (j.ok || j.contest) {
        setStatus('✓');
        onRefreshLeaderboard(); onRefreshRecent(); onRefreshContests();
        if (extra.contestId) fetchContestPlayers(extra.contestId);
      } else setStatus('✗ ' + (j.error || 'err'));
    } catch { setStatus('✗ network'); }
  };

  React.useEffect(() => {
    if (playersTab !== 'hof') fetchContestPlayers(playersTab);
  }, [playersTab]);

  // Gracze w aktualnym tabie
  const hofRows = playersTab === 'hof' ? leaderboard : [];
  const cRows   = playersTab !== 'hof' ? (contestPlayers[playersTab] || []) : [];
  const rows    = playersTab === 'hof' ? hofRows : cRows;

  return (
    <div style={{margin:'24px 20px 0', padding:'14px', border:'1px solid #2a2a2a', borderRadius:4}}>
      <div style={{fontSize:10, fontWeight:500, letterSpacing:'0.12em', color:'#f87171', textTransform:'uppercase', marginBottom:14}}>
        admin panel {status && <span style={{color:'#888', fontWeight:400, marginLeft:8}}>{status}</span>}
      </div>

      {/* Global recent */}
      <div style={{fontSize:10, color:'#333', textTransform:'uppercase', letterSpacing:'0.1em', marginBottom:6}}>global recent · others</div>
      {globalRecent.length === 0 && <div style={{fontSize:11, color:'#333', marginBottom:10}}>no lobbies yet</div>}
      {globalRecent.map(r => (
        <div key={r.log_id} style={{display:'flex', alignItems:'center', gap:6, padding:'5px 0', borderBottom:'1px solid #161616', flexWrap:'wrap'}}>
          <span onClick={() => onLoadLog(r.log_id)} style={{fontSize:12, color:'#e8e8e8', cursor:'pointer', textDecoration:'underline', minWidth:60}}>#{r.log_id}</span>
          <span style={{fontSize:11, color:'#555', flex:1, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{r.map}</span>
          <span style={{fontSize:10, color:'#333'}}>{r.vote_sessions}p · {r.total_votes}v</span>
          <button style={btnStyle(false, r.excluded)} onClick={() => act('toggle_excluded', {logId: r.log_id})}>
            {r.excluded ? 'unexclude' : 'exclude HoF'}
          </button>
          {contests.map(c => {
            const inContest = c.logs.some(l => l.log_id === r.log_id);
            return (
              <button key={c.id} style={btnStyle(inContest, false)}
                onClick={() => act(inContest ? 'remove_log_from_contest' : 'add_log_to_contest', {contestId: c.id, logId: r.log_id})}>
                {inContest ? `− ${c.name}` : `+ ${c.name}`}
              </button>
            );
          })}
        </div>
      ))}

      {/* Map poll */}
      <div style={{fontSize:10, color:'#333', textTransform:'uppercase', letterSpacing:'0.1em', marginTop:16, marginBottom:6}}>map poll</div>
      <button style={btnStyle(false, false)} onClick={() => act('create_map_poll')}>
        new map poll
      </button>

      {/* Contests management */}
      <div style={{fontSize:10, color:'#333', textTransform:'uppercase', letterSpacing:'0.1em', marginTop:16, marginBottom:6}}>contests</div>
      {contests.map(c => (
        <div key={c.id} style={{display:'flex', alignItems:'center', gap:6, padding:'4px 0', borderBottom:'1px solid #161616'}}>
          <span style={{flex:1, fontSize:12, color:'#e8e8e8'}}>{c.name}</span>
          <span style={{fontSize:10, color:'#333'}}>{c.logs.length} logs</span>
          <button style={btnStyle(true, false)} onClick={() => { if(confirm(`Delete "${c.name}"?`)) act('delete_contest', {contestId: c.id}); }}>delete</button>
        </div>
      ))}
      <div style={{display:'flex', gap:6, marginTop:8}}>
        <input value={newContestName} onChange={e => setNewContestName(e.target.value)}
          onKeyDown={e => e.key==='Enter' && newContestName.trim() && act('create_contest',{contestName:newContestName}).then(()=>setNewContestName(''))}
          placeholder="new contest name…"
          style={{flex:1, background:'#1a1a1a', border:'1px solid #2a2a2a', borderRadius:3, color:'#e8e8e8', fontSize:11, padding:'4px 8px', fontFamily:'inherit'}}/>
        <button style={btnStyle(false, false)} onClick={async () => {
          if (!newContestName.trim()) return;
          await act('create_contest', {contestName: newContestName});
          setNewContestName('');
        }}>create</button>
      </div>

      {/* Players tabs: HoF | każdy konkurs */}
      <div style={{fontSize:10, color:'#333', textTransform:'uppercase', letterSpacing:'0.1em', marginTop:16, marginBottom:8}}>ranking players</div>
      <div style={{display:'flex', gap:5, flexWrap:'wrap', marginBottom:10}}>
        {[{id:'hof', name:'Hall of Fame'}, ...contests].map(tab => (
          <button key={tab.id} onClick={() => setPlayersTab(String(tab.id))}
            style={btnStyle(false, playersTab===String(tab.id))}>
            {tab.name}
          </button>
        ))}
      </div>
      <AdminRankingPlayers
        rows={rows}
        onRemove={steamId => {
          if (playersTab === 'hof') {
            act('delete_player', {steamId});
          } else {
            act('delete_player_from_contest', {steamId, contestId: parseInt(playersTab)});
          }
        }}
        onClearAll={
          playersTab === 'hof'
            ? () => act('clear_all')
            : () => act('clear_contest_players', {contestId: parseInt(playersTab)})
        }
        actionLabel={playersTab === 'hof' ? 'clear entire HoF' : 'clear all from contest'}
      />
    </div>
  );
}

function MapPoll() {
  const [poll, setPoll]     = useState(null);
  const [votes, setVotes]   = useState({});
  const [myVote, setMyVote] = useState(null);
  const [ready, setReady]   = useState(false);

  const load = React.useCallback(() => {
    fetch('/api/map-poll')
      .then(r => r.ok ? r.json() : null)
      .then(d => { if (d) { setPoll(d.poll); setVotes(d.votes || {}); } setReady(true); })
      .catch(() => setReady(true));
  }, []);

  React.useEffect(() => {
    load();
    const id = setInterval(load, 15_000);
    return () => clearInterval(id);
  }, []);

  React.useEffect(() => {
    if (poll?.id) setMyVote(storageGet(`mv:${poll.id}`) || null);
  }, [poll?.id]);

  const castVote = async (mapName) => {
    if (myVote || !poll) return;
    const r = await fetch('/api/map-poll', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId: SESSION_ID, mapName }),
    }).catch(() => null);
    if (r?.ok) {
      const d = await r.json();
      if (d.votes) setVotes(d.votes);
      setMyVote(mapName);
      storageSet(`mv:${poll.id}`, mapName);
    }
  };

  if (!ready || !poll) return null;

  const total = Object.values(votes).reduce((a, b) => a + b, 0);
  const mode  = m => m.startsWith('pl_') ? 'pl' : m.startsWith('koth_') ? 'koth' : 'cp';

  return (
    <div style={{padding:'20px 20px 0'}}>
      <div style={{fontSize:10, fontWeight:500, letterSpacing:'0.12em', color:'#333', textTransform:'uppercase', marginBottom:8}}>
        next map{total > 0 ? <span style={{fontWeight:400}}> · {total} {total===1?'vote':'votes'}</span> : ''}
      </div>
      {poll.maps.map(map => {
        const cnt      = votes[map] || 0;
        const pct      = total > 0 ? Math.round(cnt / total * 100) : 0;
        const isMyVote = myVote === map;
        const canVote  = !myVote;
        return (
          <div key={map}
            onClick={() => canVote && castVote(map)}
            style={{display:'flex', alignItems:'center', gap:8, padding:'7px 0',
              borderBottom:'1px solid #161616',
              cursor: canVote ? 'pointer' : 'default',
              opacity: myVote && !isMyVote ? 0.45 : 1,
              borderLeft: isMyVote ? '2px solid #555' : '2px solid transparent',
              paddingLeft: isMyVote ? 6 : 8,
            }}>
            <span style={{fontSize:10, color:'#2a2a2a', minWidth:30}}>{mode(map)}</span>
            <span style={{flex:1, fontSize:12, color: isMyVote ? '#e8e8e8' : '#888',
              fontWeight: isMyVote ? 500 : 400}}>{map}</span>
            {myVote && <span style={{fontSize:11, color: isMyVote ? '#aaa' : '#333', minWidth:30, textAlign:'right'}}>{pct}%</span>}
            {!myVote && <span style={{fontSize:10, color:'#2a2a2a'}}>→</span>}
          </div>
        );
      })}
    </div>
  );
}

const DEFAULT_LIMIT_MIN = 30;

function App() {
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const [logData, setLogData] = useState(null);
  const [logId, setLogId] = useState(null);
  const [votes, setVotes] = useState({});
  const [myVotes, setMyVotes] = useState([]);
  const [leaderboard, setLeaderboard] = useState([]);
  const [contests, setContests] = useState([]);
  const [globalRecent, setGlobalRecent] = useState([]);
  const [activeTab, setActiveTab] = useState('hof'); // 'hof' | contest ID
  // Admin: reset lobby
  const [resetStatus, setResetStatus] = useState('');
  const { show: showToast, Toast } = useToast();
  // Admin: time limit controls
  const [bypassTimeLimit, setBypassTimeLimit] = useState(false);
  const [timeLimitMin, setTimeLimitMin] = useState(DEFAULT_LIMIT_MIN);

  const votesLeft = MAX_VOTES - myVotes.length;

  // Czy głosowanie jest otwarte (limit czasowy)
  const logAge = logData ? (Date.now() / 1000 - (logData.info?.date ?? 0)) : 0;
  const timeLimitSec = timeLimitMin * 60;
  const votingOpen = ADMIN_SECRET
    ? (bypassTimeLimit || logAge < timeLimitSec)
    : (URL_OPEN || logAge < timeLimitSec);
  const timeLeft = Math.max(0, Math.ceil((timeLimitSec - logAge) / 60));

  const refreshLeaderboard = React.useCallback((tab = activeTab) => {
    const url = tab === 'hof'
      ? '/api/leaderboard?limit=20'
      : `/api/leaderboard?limit=20&contest=${tab}`;
    fetch(url)
      .then(r => r.ok ? r.json() : [])
      .then(data => setLeaderboard(Array.isArray(data) ? data : []))
      .catch(() => {});
  }, [activeTab]);

  const refreshContests = React.useCallback(() => {
    fetch('/api/contests')
      .then(r => r.ok ? r.json() : [])
      .then(data => setContests(Array.isArray(data) ? data : []))
      .catch(() => {});
  }, []);

  const refreshGlobalRecent = React.useCallback(() => {
    if (!ADMIN_SECRET) return;
    fetch('/api/recent-global?limit=20')
      .then(r => r.ok ? r.json() : [])
      .then(data => setGlobalRecent(Array.isArray(data) ? data : []))
      .catch(() => {});
  }, []);

  React.useEffect(() => {
    refreshLeaderboard();
    refreshContests();
    refreshGlobalRecent();
  }, []);

  // Odśwież leaderboard gdy zmienia się aktywna zakładka
  React.useEffect(() => { refreshLeaderboard(activeTab); }, [activeTab]);

  // Live polling standings — co 10s gdy lobby otwarte, co 30s po zagłosowaniu
  React.useEffect(() => {
    if (!logId) return;
    const interval = votesLeft > 0 ? 10_000 : 30_000;
    const id = setInterval(() => {
      fetch(`/api/standings?id=${logId}`)
        .then(r => r.ok ? r.json() : null)
        .then(data => { if (data) setVotes(data); })
        .catch(() => {});
    }, interval);
    return () => clearInterval(id);
  }, [logId, votesLeft]);

  // Auto-load z URL ?log=ID przy starcie
  React.useEffect(() => {
    if (URL_LOG) { setInput(`https://logs.tf/${URL_LOG}`); loadId(URL_LOG); }
  }, []);

  const loadId = useCallback(async (id) => {
    setLoading(true); setError(''); setLogData(null);
    try {
      const data = await fetchLog(id);
      const sm = storageGet(`m:${id}`) || [];
      setMyVotes(sm);
      try {
        const sr = await fetch(`/api/standings?id=${id}`);
        setVotes(sr.ok ? await sr.json() : {});
      } catch { setVotes({}); }
      setLogData(data); setLogId(id);
      addRecentLog(id, data.info);
      document.title = `MVP · ${data.info?.map || id}`;
      // Zaktualizuj URL — link do udostępnienia
      const p = new URLSearchParams(window.location.search);
      p.set('log', id);
      window.history.replaceState(null, '', `/?${p.toString()}`);
    } catch(e) {
      setError(e.message);
    } finally {
      setLoading(false);
    }
  }, []);

  const load = useCallback(async () => {
    const id = parseLogId(input);
    if (!id) { setError('Enter a valid link or log ID (e.g. 4066082)'); return; }
    await loadId(id);
  }, [input, loadId]);

  const vote = useCallback(async (steamId, playerName) => {
    const isAdmin = !!ADMIN_SECRET;
    if (!votingOpen && !isAdmin) return;
    if (!isAdmin && (votesLeft <= 0 || myVotes.includes(steamId))) return;
    if (!isAdmin) {
      const nm = [...myVotes, steamId];
      setMyVotes(nm);
      storageSet(`m:${logId}`, nm);
    }
    try {
      const res = await fetch('/api/vote', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          logId, steamId, sessionId: SESSION_ID, playerName: playerName || '',
          ...(isAdmin ? { adminSecret: ADMIN_SECRET } : {}),
        }),
      });
      const json = await res.json();
      if (json.standings) setVotes(json.standings);
    } catch {
      setVotes(v => ({ ...v, [steamId]: (v[steamId]||0)+1 }));
    }
  }, [myVotes, votesLeft, logId, votingOpen]);

  const resetLobby = useCallback(async () => {
    setResetStatus('…');
    await fetch('/api/admin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'reset_session', secret: ADMIN_SECRET, logId, sessionId: SESSION_ID }),
    }).catch(() => {});
    storageSet(`m:${logId}`, []);
    setMyVotes([]);
    const sr = await fetch(`/api/standings?id=${logId}`).catch(() => null);
    if (sr?.ok) setVotes(await sr.json());
    setResetStatus('✓ reset');
  }, [logId]);

  // Auto-głos dla medyków przy załadowaniu logu
  React.useEffect(() => {
    if (!logData || !logId) return;
    const medics = Object.entries(logData.players || {})
      .filter(([, p]) => topClass(p.class_stats) === 'Medic')
      .map(([id]) => ({ id, name: logData.names?.[id] || '' }));
    if (!medics.length) return;
    const autoSession = `auto:${logId}`;
    medics.forEach(({ id, name }) => {
      fetch('/api/vote', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ logId, steamId: id, sessionId: autoSession, playerName: name }),
      })
        .then(r => r.json())
        .then(j => { if (j.standings) setVotes(j.standings); })
        .catch(() => {});
    });
  }, [logId]);

  const reset = () => {
    setLogData(null); setLogId(null); setInput(''); setVotes({}); setMyVotes([]); setError(''); setResetStatus('');
    document.title = 'MVP · mvp.tf';
    const p = new URLSearchParams(window.location.search);
    p.delete('log');
    const qs = p.toString();
    window.history.replaceState(null, '', qs ? `/?${qs}` : '/');
  };

  const players = logData ? Object.entries(logData.players||{}).map(([id,p]) => ({
    id, name: logData.names?.[id] || id,
    team: p.team === 'Blue' ? 'BLU' : 'RED',
    cls: topClass(p.class_stats), k: p.kills??0, d: p.deaths??0, dpm: p.dapm??0
  })) : [];

  const blu = players.filter(p => p.team==='BLU');
  const red = players.filter(p => p.team==='RED');
  const ranked = [...players].filter(p => (votes[p.id]||0)>0).sort((a,b) => (votes[b.id]||0)-(votes[a.id]||0));
  const bScore = logData?.teams?.Blue?.score ?? 0;
  const rScore = logData?.teams?.Red?.score ?? 0;

  return (
    <div style={{maxWidth:520, margin:'0 auto', paddingBottom:48}}>

      <div style={{padding:'24px 20px 12px', borderBottom:'1px solid #1e1e1e', textAlign:'center'}}>
        <span style={{fontSize:18, fontWeight:500, color:'#e8e8e8'}}>MVP</span>
        {' '}
        <a href="https://mvp.tf" style={{fontSize:12, color:'#444', letterSpacing:'0.06em', textDecoration:'none'}}
          onMouseEnter={e=>e.target.style.color='#888'} onMouseLeave={e=>e.target.style.color='#444'}>mvp.tf</a>
      </div>

      <div style={{display:'flex', gap:8, padding:'18px 20px 0'}}>
        <input
          placeholder="paste a link from logs.tf and press GO"
          value={input}
          onChange={e => { setInput(e.target.value); setError(''); }}
          onKeyDown={e => e.key==='Enter' && !loading && !logData && load()}
        />
        <button className="btn-go" onClick={logData ? reset : load} disabled={loading}>
          {loading ? '···' : logData ? '↩' : 'GO'}
        </button>
      </div>

      {error && <p style={{margin:'10px 20px 0', fontSize:12, color:'#f87171'}}>{error}</p>}
      {!logData && !loading && !error && (() => {
        const myRecent = storageGet('recent') || [];
        // Dla admina: pokaż "others" = globalRecent minus te które admin też ma lokalnie
        const myIds = new Set(myRecent.map(r => r.id));
        const othersRecent = ADMIN_SECRET
          ? globalRecent.filter(r => !myIds.has(r.log_id))
          : [];
        const hasAny = myRecent.length > 0 || othersRecent.length > 0;

        const recentRow = (id, map, onClick, ts) => (
          <div key={id} onClick={onClick}
            style={{display:'flex', alignItems:'center', gap:10, padding:'7px 0', borderBottom:'1px solid #161616', cursor:'pointer'}}
            onMouseEnter={e=>e.currentTarget.style.opacity='.7'} onMouseLeave={e=>e.currentTarget.style.opacity='1'}>
            <span style={{fontSize:12, color:'#e8e8e8'}}>#{id}</span>
            {map && <span style={{fontSize:11, color:'#555', flex:1, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{map}</span>}
            {ts && <span style={{fontSize:10, color:'#333', flexShrink:0}}>{timeAgo(ts)}</span>}
            {!ts && <span style={{marginLeft:'auto', fontSize:10, color:'#333'}}>→</span>}
          </div>
        );

        return hasAny ? (
          <div style={{padding:'20px 20px 0'}}>
            {myRecent.length > 0 && <>
              <div style={{fontSize:10, fontWeight:500, letterSpacing:'0.12em', color:'#333', textTransform:'uppercase', marginBottom:8}}>
                {ADMIN_SECRET ? 'recent · yours' : 'recent'}
              </div>
              {myRecent.map(r => recentRow(r.id, r.map, () => { setInput(`https://logs.tf/${r.id}`); loadId(r.id); }, r.ts))}
            </>}
            {othersRecent.length > 0 && <>
              <div style={{fontSize:10, fontWeight:500, letterSpacing:'0.12em', color:'#333', textTransform:'uppercase', marginTop:12, marginBottom:8}}>
                recent · others
              </div>
              {othersRecent.map(r => recentRow(r.log_id, r.map, () => { setInput(`https://logs.tf/${r.log_id}`); loadId(r.log_id); }, new Date(r.last_seen).getTime()))}
            </>}
          </div>
        ) : <p style={{textAlign:'center', color:'#2a2a2a', fontSize:13, marginTop:40}}>paste a link from logs.tf and press GO</p>;
      })()}

      {!logData && !loading && <MapPoll />}

      {!logData && !loading && (
        <div style={{padding:'20px 20px 0'}}>
          {/* Tabs: Hall of Fame + konkursy */}
          {contests.length > 0 && (
            <div style={{display:'flex', gap:6, marginBottom:12, flexWrap:'wrap'}}>
              {[{id:'hof', name:'Hall of Fame'}, ...contests].map(tab => (
                <button key={tab.id} onClick={() => setActiveTab(tab.id)}
                  style={{background: activeTab===tab.id ? '#e8e8e8' : 'transparent',
                    color: activeTab===tab.id ? '#0f0f0f' : '#555',
                    border:'1px solid', borderColor: activeTab===tab.id ? '#e8e8e8' : '#2a2a2a',
                    borderRadius:3, fontSize:11, padding:'3px 10px', cursor:'pointer', fontFamily:'inherit'}}>
                  {tab.name}
                </button>
              ))}
            </div>
          )}

          {/* Leaderboard */}
          {leaderboard.length > 0 ? (
            <>
              <div style={{fontSize:10, fontWeight:500, letterSpacing:'0.12em', color:'#333', textTransform:'uppercase', marginBottom:8}}>
                {activeTab === 'hof' ? 'hall of fame' : contests.find(c=>c.id==activeTab)?.name || ''}
              </div>
              {leaderboard.map((row, i) => (
                <div key={row.steam_id} style={{display:'flex', alignItems:'center', gap:10, padding:'7px 0', borderBottom:'1px solid #161616'}}>
                  <span style={{fontSize:11, color:'#2a2a2a', minWidth:18, textAlign:'right'}}>{i+1}</span>
                  <a href={`https://logs.tf/profile/${toSteam64(row.steam_id)}`} target="_blank" rel="noopener noreferrer"
                    style={{flex:1, fontSize:13, fontWeight:500, color:'#e8e8e8', textDecoration:'none', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}
                    onMouseEnter={e=>e.target.style.textDecoration='underline'} onMouseLeave={e=>e.target.style.textDecoration='none'}>
                    {row.name || row.steam_id}
                  </a>
                  <span style={{fontSize:10, color:'#444'}}>{row.games_voted_in}g</span>
                  <span style={{fontSize:13, fontWeight:500, color:'#e8e8e8', minWidth:20, textAlign:'right'}}>{row.total_votes}</span>
                </div>
              ))}
            </>
          ) : (
            <p style={{textAlign:'center', color:'#2a2a2a', fontSize:13, marginTop:20}}>no votes yet</p>
          )}
        </div>
      )}

      {!logData && !loading && ADMIN_SECRET && (
        <AdminHomePanel
          leaderboard={leaderboard}
          onRefreshLeaderboard={refreshLeaderboard}
          globalRecent={globalRecent}
          onRefreshRecent={refreshGlobalRecent}
          contests={contests}
          onRefreshContests={refreshContests}
          onLoadLog={id => { setInput(`https://logs.tf/${id}`); loadId(id); }}
        />
      )}

      {loading && <p style={{textAlign:'center', color:'#333', fontSize:13, marginTop:56}}>loading…</p>}

      {logData && (
        <div style={{padding:'0 20px'}}>
          <div style={{display:'flex', alignItems:'center', justifyContent:'center', gap:12, marginTop:28}}>
            <span style={{fontSize:11, fontWeight:500, letterSpacing:'0.12em', color:'#378ADD'}}>BLU</span>
            <span style={{fontSize:44, fontWeight:500, color:'#e8e8e8', lineHeight:1, letterSpacing:'-0.04em'}}>{bScore}</span>
            <span style={{fontSize:28, color:'#2a2a2a'}}>—</span>
            <span style={{fontSize:44, fontWeight:500, color:'#e8e8e8', lineHeight:1, letterSpacing:'-0.04em'}}>{rScore}</span>
            <span style={{fontSize:11, fontWeight:500, letterSpacing:'0.12em', color:'#E24B4A'}}>RED</span>
          </div>
          <p style={{textAlign:'center', fontSize:11, color:'#444', marginTop:4, letterSpacing:'0.05em'}}>{logData.info?.map||''}</p>

          <p style={{textAlign:'center', fontSize:12, color:'#555', margin:'16px 0 20px'}}>
            {!votingOpen && !ADMIN_SECRET
              ? <span style={{color:'#f87171'}}>voting closed — {timeLimitMin}min window expired</span>
              : ADMIN_SECRET
                ? <span style={{color:'#f87171'}}>admin — unlimited votes</span>
                : votesLeft > 0
                  ? <><b style={{color:'#e8e8e8'}}>{votesLeft}</b> / {MAX_VOTES} votes left · {timeLeft}min remaining</>
                  : <span style={{color:'#4ade80'}}>✓ voted</span>
            }
          </p>

          <div style={{display:'flex', gap:0}}>
            <div style={{flex:1, minWidth:0}}>
              <div style={{fontSize:11, fontWeight:500, letterSpacing:'0.12em', color:'#378ADD', textAlign:'center', marginBottom:10}}>BLU</div>
              {blu.map(p => <PlayerRow key={p.id} p={p} votes={votes} myVotes={myVotes} votesLeft={ADMIN_SECRET ? 99 : votesLeft} votingOpen={votingOpen || !!ADMIN_SECRET} onVote={vote} accent="#378ADD"/>)}
            </div>
            <div style={{width:1, background:'#1e1e1e', margin:'0 14px'}}/>
            <div style={{flex:1, minWidth:0}}>
              <div style={{fontSize:11, fontWeight:500, letterSpacing:'0.12em', color:'#E24B4A', textAlign:'center', marginBottom:10}}>RED</div>
              {red.map(p => <PlayerRow key={p.id} p={p} votes={votes} myVotes={myVotes} votesLeft={ADMIN_SECRET ? 99 : votesLeft} votingOpen={votingOpen || !!ADMIN_SECRET} onVote={vote} accent="#E24B4A"/>)}
            </div>
          </div>

          {ranked.length > 0 && (votesLeft === 0 || !votingOpen || ADMIN_SECRET) && (
            <div style={{marginTop:28, paddingTop:18, borderTop:'1px solid #1e1e1e'}}>
              <div style={{fontSize:11, fontWeight:500, letterSpacing:'0.12em', color:'#333', marginBottom:10, textTransform:'uppercase'}}>standings</div>
              {ranked.map((p,i) => (
                <div key={p.id} style={{display:'flex', alignItems:'center', gap:12, padding:'7px 0', borderBottom:'1px solid #161616'}}>
                  <span style={{fontSize:11, color:'#333', minWidth:14}}>{i+1}</span>
                  <span style={{flex:1, fontSize:13, fontWeight:500, color:'#e8e8e8'}}>{p.name}</span>
                  <span style={{fontSize:11, fontWeight:500, letterSpacing:'0.08em', color: p.team==='BLU'?'#378ADD':'#E24B4A'}}>{p.team}</span>
                  <span style={{fontSize:14, fontWeight:500, color:'#e8e8e8'}}>{votes[p.id]}</span>
                </div>
              ))}
            </div>
          )}

          {ADMIN_SECRET && logId && (
            <div style={{marginTop:20, padding:'12px', border:'1px solid #1e1e1e', borderRadius:4}}>
              <div style={{fontSize:10, fontWeight:500, letterSpacing:'0.12em', color:'#f87171', textTransform:'uppercase', marginBottom:10}}>admin · lobby</div>
              <div style={{display:'flex', flexWrap:'wrap', gap:8, alignItems:'center'}}>
                <button onClick={resetLobby}
                  style={{background:'transparent', border:'1px solid #2a2a2a', color:'#777', borderRadius:3, fontSize:11, padding:'4px 10px', cursor:'pointer'}}>
                  reset my votes
                </button>
                <label style={{display:'flex', alignItems:'center', gap:6, fontSize:11, color:'#555', cursor:'pointer'}}>
                  <input type="checkbox" checked={bypassTimeLimit} onChange={e => setBypassTimeLimit(e.target.checked)}
                    style={{accentColor:'#f87171'}}/>
                  bypass time limit (your view)
                </label>
                <label style={{display:'flex', alignItems:'center', gap:6, fontSize:11, color:'#555'}}>
                  window:
                  <input type="number" min="1" max="1440" value={timeLimitMin}
                    onChange={e => setTimeLimitMin(Math.max(1, parseInt(e.target.value)||30))}
                    style={{width:48, background:'#1a1a1a', border:'1px solid #2a2a2a', borderRadius:3,
                      color:'#e8e8e8', fontSize:11, padding:'2px 6px', fontFamily:'inherit'}}/>
                  min
                </label>
                {resetStatus && <span style={{fontSize:11, color:'#888'}}>{resetStatus}</span>}
              </div>
              {/* Contest assignment dla tego lobby */}
              {contests.length > 0 && (
                <div style={{marginTop:10, display:'flex', flexWrap:'wrap', gap:6, alignItems:'center'}}>
                  <span style={{fontSize:10, color:'#333', textTransform:'uppercase', letterSpacing:'0.1em'}}>contests:</span>
                  {contests.map(c => {
                    const inContest = c.logs.some(l => l.log_id === logId);
                    return (
                      <button key={c.id}
                        onClick={async () => {
                          await adminFetch(inContest ? 'remove_log_from_contest' : 'add_log_to_contest',
                            { contestId: c.id, logId });
                          refreshContests();
                        }}
                        style={{background: inContest ? '#e8e8e8' : 'transparent',
                          color: inContest ? '#0f0f0f' : '#555',
                          border: `1px solid ${inContest ? '#e8e8e8' : '#2a2a2a'}`,
                          borderRadius:3, fontSize:10, padding:'2px 8px', cursor:'pointer', fontFamily:'inherit'}}>
                        {inContest ? `✓ ${c.name}` : `+ ${c.name}`}
                      </button>
                    );
                  })}
                </div>
              )}
              {/* Exclude z HoF */}
              {(() => {
                const setting = globalRecent.find(r => r.log_id === logId);
                const excluded = setting?.excluded || false;
                return (
                  <div style={{marginTop:8, display:'flex', alignItems:'center', gap:8}}>
                    <button onClick={async () => { await adminFetch('toggle_excluded', {logId}); refreshGlobalRecent(); }}
                      style={{background:'transparent', border:`1px solid ${excluded?'#555':'#2a2a2a'}`,
                        color: excluded?'#aaa':'#444', borderRadius:3, fontSize:10, padding:'2px 8px', cursor:'pointer'}}>
                      {excluded ? '✓ excluded from HoF' : 'exclude from HoF'}
                    </button>
                  </div>
                );
              })()}
              {/* Share link */}
              <div style={{marginTop:8, fontSize:11, color:'#444'}}>
                share link:
                <span onClick={() => { const u=`${window.location.origin}/?log=${logId}&open`; navigator.clipboard?.writeText(u).then(()=>showToast('✓ link copied')); }}
                  style={{marginLeft:6, color:'#888', cursor:'pointer', textDecoration:'underline', wordBreak:'break-all'}}>
                  {window.location.origin}/?log={logId}&open
                </span>
              </div>
            </div>
          )}
        </div>
      )}
    </div>
    {Toast}
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
