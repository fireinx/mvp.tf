<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MVP · logs.tf</title>
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0f0f0f;color:#aaa;font-family:'DM Mono','Courier New',monospace;min-height:100vh}
  input{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:4px;padding:10px 14px;font-size:14px;font-family:inherit;color:#e8e8e8;outline:none;transition:border-color .15s;width:100%}
  input:focus{border-color:#3a3a3a}
  .btn-go{background:#e8e8e8;color:#0f0f0f;border:none;border-radius:4px;font-family:inherit;font-size:14px;font-weight:500;padding:10px 20px;cursor:pointer;transition:background .15s;flex-shrink:0}
  .btn-go:hover:not(:disabled){background:#ccc}
  .btn-go:disabled{opacity:.4;cursor:not-allowed}
  .vbtn{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:3px;color:#aaa;font-family:inherit;font-size:12px;font-weight:500;padding:3px 10px;cursor:pointer;flex-shrink:0;transition:all .1s}
  .vbtn:hover:not(:disabled){background:#e8e8e8;color:#0f0f0f;border-color:#e8e8e8}
  .vbtn.voted{background:#e8e8e8;color:#0f0f0f;border-color:#e8e8e8}
  .vbtn:disabled{color:#2a2a2a;border-color:#1e1e1e;cursor:not-allowed}
  ::-webkit-scrollbar{width:4px}
  ::-webkit-scrollbar-track{background:#0f0f0f}
  ::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:2px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useCallback } = React;
const MAX_VOTES = 3;
// SESSION_ID persists across refreshes so the same browser can't vote twice
function getSessionId() {
  let sid = localStorage.getItem('sid');
  if (!sid) { sid = Math.random().toString(36).slice(2, 18); localStorage.setItem('sid', sid); }
  return sid;
}
const SESSION_ID = getSessionId();

const CLASS_SHORT = {
  scout:'Scout', soldier:'Solly', pyro:'Pyro', demoman:'Demo',
  heavyweapons:'Heavy', engineer:'Engi', medic:'Medic', sniper:'Sniper', spy:'Spy'
};

function parseLogId(s) {
  const m = s.trim().match(/(\d{5,8})/);
  return m ? m[1] : null;
}

// logs.tf API zwraca Steam3 [U:1:XXXXXXX] — konwertujemy do Steam64
function toSteam64(id) {
  if (/^\d{17}$/.test(id)) return id;
  const m = String(id).match(/\[U:1:(\d+)\]/);
  if (m) return (BigInt('76561197960265728') + BigInt(m[1])).toString();
  return id;
}

function topClass(stats) {
  if (!stats?.length) return '';
  const t = stats.reduce((a,b) => a.total_time > b.total_time ? a : b);
  return CLASS_SHORT[t.type] || t.type || '';
}

async function fetchLog(logId) {
  // Proxy przez Vercel function — bez CORS problemów
  const res = await fetch(`/api/log?id=${logId}`);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const data = await res.json();
  if (!data.success) throw new Error('Log not found');
  return data;
}

function storageGet(key) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; } catch { return null; }
}
function storageSet(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
}
function addRecentLog(id, info) {
  const list = storageGet('recent') || [];
  const filtered = list.filter(x => x.id !== id);
  filtered.unshift({ id, map: info?.map || '', title: info?.title || '' });
  storageSet('recent', filtered.slice(0, 5));
}

function PlayerRow({ p, votes, myVotes, votesLeft, votingOpen, onVote, accent }) {
  const voted = myVotes.includes(p.id);
  const cnt = votes[p.id] || 0;
  const can = votingOpen && votesLeft > 0 && !voted;
  return (
    <div style={{
      display:'flex', alignItems:'center', gap:8,
      padding:'7px 0 7px 8px',
      borderBottom:'1px solid #1a1a1a',
      borderLeft: voted ? `2px solid ${accent}` : '2px solid transparent'
    }}>
      <div style={{flex:1, minWidth:0}}>
        <a href={`https://logs.tf/profile/${toSteam64(p.id)}`} target="_blank" rel="noopener noreferrer"
          style={{fontSize:13, fontWeight:500, color:'#e8e8e8', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis', display:'block', textDecoration:'none'}}
          onMouseEnter={e=>e.target.style.textDecoration='underline'} onMouseLeave={e=>e.target.style.textDecoration='none'}
        >{p.name}</a>
        <div style={{fontSize:10, color:'#777', marginTop:2}}>{[p.cls, `${p.k}/${p.d}`, p.dpm ? `${p.dpm}dpm` : ''].filter(Boolean).join(' · ')}</div>
      </div>
      {cnt > 0 && <span style={{fontSize:13, fontWeight:500, color:'#e8e8e8', minWidth:16, textAlign:'right'}}>{cnt}</span>}
      <button className={`vbtn${voted ? ' voted' : ''}`} onClick={() => onVote(p.id, p.name)} disabled={!can}>
        {voted ? '✓' : '+1'}
      </button>
    </div>
  );
}

// Odczytaj ?admin=SECRET z URL — nie pokazuj w historii
const ADMIN_SECRET = new URLSearchParams(window.location.search).get('admin') || '';

function AdminPanel({ leaderboard, onRefresh }) {
  const [status, setStatus] = useState('');
  const [confirmClear, setConfirmClear] = useState(false);
  const [removed, setRemoved] = useState(new Set());

  async function adminAction(body) {
    setStatus('…');
    // Optimistic: ukryj od razu
    if (body.steamId) setRemoved(s => new Set([...s, body.steamId]));
    if (body.action === 'clear_all') setRemoved(new Set(leaderboard.map(r => r.steam_id)));
    try {
      const r = await fetch('/api/admin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ...body, secret: ADMIN_SECRET }),
      });
      const j = await r.json();
      if (j.ok) { setStatus(`✓ done (${j.deleted ?? ''} rows)`); onRefresh(); }
      else { setStatus('✗ ' + (j.error || 'error')); setRemoved(new Set()); }
    } catch { setStatus('✗ network error'); setRemoved(new Set()); }
  }

  const visible = leaderboard.filter(r => !removed.has(r.steam_id));

  return (
    <div style={{margin:'24px 20px 0', padding:'14px', border:'1px solid #2a2a2a', borderRadius:4}}>
      <div style={{fontSize:10, fontWeight:500, letterSpacing:'0.12em', color:'#f87171', textTransform:'uppercase', marginBottom:12}}>admin panel</div>
      <div style={{fontSize:11, color:'#555', marginBottom:12}}>Click remove to delete a player from the leaderboard.</div>
      {visible.map(row => (
        <div key={row.steam_id} style={{display:'flex', alignItems:'center', gap:8, padding:'5px 0', borderBottom:'1px solid #161616'}}>
          <span style={{flex:1, fontSize:12, color:'#e8e8e8', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{row.name || row.steam_id}</span>
          <span style={{fontSize:11, color:'#555'}}>{row.total_votes}pts</span>
          <button onClick={() => adminAction({ action:'delete_player', steamId: row.steam_id })}
            style={{background:'transparent', border:'1px solid #3a1a1a', color:'#f87171', borderRadius:3, fontSize:11, padding:'2px 8px', cursor:'pointer'}}>
            remove
          </button>
        </div>
      ))}
      <div style={{marginTop:14, display:'flex', gap:8, alignItems:'center'}}>
        {!confirmClear
          ? <button onClick={() => setConfirmClear(true)}
              style={{background:'transparent', border:'1px solid #3a1a1a', color:'#f87171', borderRadius:3, fontSize:11, padding:'4px 12px', cursor:'pointer'}}>
              clear entire leaderboard
            </button>
          : <>
              <button onClick={() => { adminAction({ action:'clear_all' }); setConfirmClear(false); }}
                style={{background:'#7f1d1d', border:'none', color:'#fca5a5', borderRadius:3, fontSize:11, padding:'4px 12px', cursor:'pointer'}}>
                confirm clear
              </button>
              <button onClick={() => setConfirmClear(false)}
                style={{background:'transparent', border:'1px solid #2a2a2a', color:'#555', borderRadius:3, fontSize:11, padding:'4px 12px', cursor:'pointer'}}>
                cancel
              </button>
            </>
        }
        {status && <span style={{fontSize:11, color:'#888'}}>{status}</span>}
      </div>
    </div>
  );
}

const DEFAULT_LIMIT_MIN = 30;

function App() {
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const [logData, setLogData] = useState(null);
  const [logId, setLogId] = useState(null);
  const [votes, setVotes] = useState({});
  const [myVotes, setMyVotes] = useState([]);
  const [leaderboard, setLeaderboard] = useState([]);
  // Admin: reset lobby
  const [resetStatus, setResetStatus] = useState('');
  // Admin: time limit controls
  const [bypassTimeLimit, setBypassTimeLimit] = useState(false);
  const [timeLimitMin, setTimeLimitMin] = useState(DEFAULT_LIMIT_MIN);

  const votesLeft = MAX_VOTES - myVotes.length;

  // Czy głosowanie jest otwarte (limit czasowy)
  const logAge = logData ? (Date.now() / 1000 - (logData.info?.date ?? 0)) : 0;
  const timeLimitSec = timeLimitMin * 60;
  const votingOpen = ADMIN_SECRET
    ? (bypassTimeLimit || logAge < timeLimitSec)
    : logAge < timeLimitSec;
  const timeLeft = Math.max(0, Math.ceil((timeLimitSec - logAge) / 60));

  const refreshLeaderboard = React.useCallback(() => {
    fetch('/api/leaderboard?limit=20')
      .then(r => r.ok ? r.json() : [])
      .then(data => setLeaderboard(Array.isArray(data) ? data : []))
      .catch(() => {});
  }, []);

  React.useEffect(() => { refreshLeaderboard(); }, []);

  const loadId = useCallback(async (id) => {
    setLoading(true); setError(''); setLogData(null);
    try {
      const data = await fetchLog(id);
      const sm = storageGet(`m:${id}`) || [];
      setMyVotes(sm);
      try {
        const sr = await fetch(`/api/standings?id=${id}`);
        setVotes(sr.ok ? await sr.json() : {});
      } catch { setVotes({}); }
      setLogData(data); setLogId(id);
      addRecentLog(id, data.info);
    } catch(e) {
      setError(e.message);
    } finally {
      setLoading(false);
    }
  }, []);

  const load = useCallback(async () => {
    const id = parseLogId(input);
    if (!id) { setError('Enter a valid link or log ID (e.g. 4066082)'); return; }
    await loadId(id);
  }, [input, loadId]);

  const vote = useCallback(async (steamId, playerName) => {
    const isAdmin = !!ADMIN_SECRET;
    if (!votingOpen && !isAdmin) return;
    if (!isAdmin && (votesLeft <= 0 || myVotes.includes(steamId))) return;
    if (!isAdmin) {
      const nm = [...myVotes, steamId];
      setMyVotes(nm);
      storageSet(`m:${logId}`, nm);
    }
    try {
      const res = await fetch('/api/vote', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          logId, steamId, sessionId: SESSION_ID, playerName: playerName || '',
          ...(isAdmin ? { adminSecret: ADMIN_SECRET } : {}),
        }),
      });
      const json = await res.json();
      if (json.standings) setVotes(json.standings);
    } catch {
      setVotes(v => ({ ...v, [steamId]: (v[steamId]||0)+1 }));
    }
  }, [myVotes, votesLeft, logId, votingOpen]);

  const resetLobby = useCallback(async () => {
    setResetStatus('…');
    await fetch('/api/admin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'reset_session', secret: ADMIN_SECRET, logId, sessionId: SESSION_ID }),
    }).catch(() => {});
    storageSet(`m:${logId}`, []);
    setMyVotes([]);
    const sr = await fetch(`/api/standings?id=${logId}`).catch(() => null);
    if (sr?.ok) setVotes(await sr.json());
    setResetStatus('✓ reset');
  }, [logId]);

  // Auto-głos dla medyków przy załadowaniu logu
  React.useEffect(() => {
    if (!logData || !logId) return;
    const medics = Object.entries(logData.players || {})
      .filter(([, p]) => topClass(p.class_stats) === 'Medic')
      .map(([id]) => ({ id, name: logData.names?.[id] || '' }));
    if (!medics.length) return;
    const autoSession = `auto:${logId}`;
    medics.forEach(({ id, name }) => {
      fetch('/api/vote', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ logId, steamId: id, sessionId: autoSession, playerName: name }),
      })
        .then(r => r.json())
        .then(j => { if (j.standings) setVotes(j.standings); })
        .catch(() => {});
    });
  }, [logId]);

  const reset = () => { setLogData(null); setLogId(null); setInput(''); setVotes({}); setMyVotes([]); setError(''); };

  const players = logData ? Object.entries(logData.players||{}).map(([id,p]) => ({
    id, name: logData.names?.[id] || id,
    team: p.team === 'Blue' ? 'BLU' : 'RED',
    cls: topClass(p.class_stats), k: p.kills??0, d: p.deaths??0, dpm: p.dapm??0
  })) : [];

  const blu = players.filter(p => p.team==='BLU');
  const red = players.filter(p => p.team==='RED');
  const ranked = [...players].filter(p => (votes[p.id]||0)>0).sort((a,b) => (votes[b.id]||0)-(votes[a.id]||0));
  const bScore = logData?.teams?.Blue?.score ?? 0;
  const rScore = logData?.teams?.Red?.score ?? 0;

  return (
    <div style={{maxWidth:520, margin:'0 auto', paddingBottom:48}}>

      <div style={{padding:'24px 20px 12px', borderBottom:'1px solid #1e1e1e', textAlign:'center'}}>
        <span style={{fontSize:18, fontWeight:500, color:'#e8e8e8'}}>MVP</span>
        {' '}
        <a href="https://mvp.tf" style={{fontSize:12, color:'#444', letterSpacing:'0.06em', textDecoration:'none'}}
          onMouseEnter={e=>e.target.style.color='#888'} onMouseLeave={e=>e.target.style.color='#444'}>mvp.tf</a>
      </div>

      <div style={{display:'flex', gap:8, padding:'18px 20px 0'}}>
        <input
          placeholder="paste a link from logs.tf and press GO"
          value={input}
          onChange={e => { setInput(e.target.value); setError(''); }}
          onKeyDown={e => e.key==='Enter' && !loading && !logData && load()}
        />
        <button className="btn-go" onClick={logData ? reset : load} disabled={loading}>
          {loading ? '···' : logData ? '↩' : 'GO'}
        </button>
      </div>

      {error && <p style={{margin:'10px 20px 0', fontSize:12, color:'#f87171'}}>{error}</p>}
      {!logData && !loading && !error && (() => {
        const recent = storageGet('recent') || [];
        return recent.length > 0 ? (
          <div style={{padding:'20px 20px 0'}}>
            <div style={{fontSize:10, fontWeight:500, letterSpacing:'0.12em', color:'#333', textTransform:'uppercase', marginBottom:8}}>recent</div>
            {recent.map(r => (
              <div key={r.id} onClick={() => { setInput(`https://logs.tf/${r.id}`); loadId(r.id); }}
                style={{display:'flex', alignItems:'center', gap:10, padding:'7px 0', borderBottom:'1px solid #161616', cursor:'pointer'}}
                onMouseEnter={e=>e.currentTarget.style.opacity='.7'} onMouseLeave={e=>e.currentTarget.style.opacity='1'}>
                <span style={{fontSize:12, color:'#e8e8e8'}}>#{r.id}</span>
                {r.map && <span style={{fontSize:11, color:'#555'}}>{r.map}</span>}
                <span style={{marginLeft:'auto', fontSize:10, color:'#333'}}>→</span>
              </div>
            ))}
          </div>
        ) : <p style={{textAlign:'center', color:'#2a2a2a', fontSize:13, marginTop:40}}>paste a link from logs.tf and press GO</p>;
      })()}

      {!logData && !loading && leaderboard.length > 0 && (
        <div style={{padding:'28px 20px 0'}}>
          <div style={{fontSize:10, fontWeight:500, letterSpacing:'0.12em', color:'#333', textTransform:'uppercase', marginBottom:8}}>leaderboard</div>
          {leaderboard.map((row, i) => (
            <div key={row.steam_id} style={{display:'flex', alignItems:'center', gap:10, padding:'7px 0', borderBottom:'1px solid #161616'}}>
              <span style={{fontSize:11, color:'#2a2a2a', minWidth:18, textAlign:'right'}}>{i+1}</span>
              <a href={`https://logs.tf/profile/${toSteam64(row.steam_id)}`} target="_blank" rel="noopener noreferrer"
                style={{flex:1, fontSize:13, fontWeight:500, color:'#e8e8e8', textDecoration:'none', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}
                onMouseEnter={e=>e.target.style.textDecoration='underline'} onMouseLeave={e=>e.target.style.textDecoration='none'}>
                {row.name || row.steam_id}
              </a>
              <span style={{fontSize:10, color:'#444'}}>{row.games_voted_in}g</span>
              <span style={{fontSize:13, fontWeight:500, color:'#e8e8e8', minWidth:20, textAlign:'right'}}>{row.total_votes}</span>
            </div>
          ))}
        </div>
      )}

      {!logData && !loading && ADMIN_SECRET && (
        <AdminPanel leaderboard={leaderboard} onRefresh={refreshLeaderboard} />
      )}

      {loading && <p style={{textAlign:'center', color:'#333', fontSize:13, marginTop:56}}>loading…</p>}

      {logData && (
        <div style={{padding:'0 20px'}}>
          <div style={{display:'flex', alignItems:'center', justifyContent:'center', gap:12, marginTop:28}}>
            <span style={{fontSize:11, fontWeight:500, letterSpacing:'0.12em', color:'#378ADD'}}>BLU</span>
            <span style={{fontSize:44, fontWeight:500, color:'#e8e8e8', lineHeight:1, letterSpacing:'-0.04em'}}>{bScore}</span>
            <span style={{fontSize:28, color:'#2a2a2a'}}>—</span>
            <span style={{fontSize:44, fontWeight:500, color:'#e8e8e8', lineHeight:1, letterSpacing:'-0.04em'}}>{rScore}</span>
            <span style={{fontSize:11, fontWeight:500, letterSpacing:'0.12em', color:'#E24B4A'}}>RED</span>
          </div>
          <p style={{textAlign:'center', fontSize:11, color:'#444', marginTop:4, letterSpacing:'0.05em'}}>{logData.info?.map||''}</p>

          <p style={{textAlign:'center', fontSize:12, color:'#555', margin:'16px 0 20px'}}>
            {!votingOpen && !ADMIN_SECRET
              ? <span style={{color:'#f87171'}}>voting closed — {timeLimitMin}min window expired</span>
              : ADMIN_SECRET
                ? <span style={{color:'#f87171'}}>admin — unlimited votes</span>
                : votesLeft > 0
                  ? <><b style={{color:'#e8e8e8'}}>{votesLeft}</b> / {MAX_VOTES} votes left · {timeLeft}min remaining</>
                  : <span style={{color:'#4ade80'}}>✓ voted</span>
            }
          </p>

          <div style={{display:'flex', gap:0}}>
            <div style={{flex:1, minWidth:0}}>
              <div style={{fontSize:11, fontWeight:500, letterSpacing:'0.12em', color:'#378ADD', textAlign:'center', marginBottom:10}}>BLU</div>
              {blu.map(p => <PlayerRow key={p.id} p={p} votes={votes} myVotes={myVotes} votesLeft={ADMIN_SECRET ? 99 : votesLeft} votingOpen={votingOpen || !!ADMIN_SECRET} onVote={vote} accent="#378ADD"/>)}
            </div>
            <div style={{width:1, background:'#1e1e1e', margin:'0 14px'}}/>
            <div style={{flex:1, minWidth:0}}>
              <div style={{fontSize:11, fontWeight:500, letterSpacing:'0.12em', color:'#E24B4A', textAlign:'center', marginBottom:10}}>RED</div>
              {red.map(p => <PlayerRow key={p.id} p={p} votes={votes} myVotes={myVotes} votesLeft={ADMIN_SECRET ? 99 : votesLeft} votingOpen={votingOpen || !!ADMIN_SECRET} onVote={vote} accent="#E24B4A"/>)}
            </div>
          </div>

          {ranked.length > 0 && (votesLeft === 0 || ADMIN_SECRET) && (
            <div style={{marginTop:28, paddingTop:18, borderTop:'1px solid #1e1e1e'}}>
              <div style={{fontSize:11, fontWeight:500, letterSpacing:'0.12em', color:'#333', marginBottom:10, textTransform:'uppercase'}}>standings</div>
              {ranked.map((p,i) => (
                <div key={p.id} style={{display:'flex', alignItems:'center', gap:12, padding:'7px 0', borderBottom:'1px solid #161616'}}>
                  <span style={{fontSize:11, color:'#333', minWidth:14}}>{i+1}</span>
                  <span style={{flex:1, fontSize:13, fontWeight:500, color:'#e8e8e8'}}>{p.name}</span>
                  <span style={{fontSize:11, fontWeight:500, letterSpacing:'0.08em', color: p.team==='BLU'?'#378ADD':'#E24B4A'}}>{p.team}</span>
                  <span style={{fontSize:14, fontWeight:500, color:'#e8e8e8'}}>{votes[p.id]}</span>
                </div>
              ))}
            </div>
          )}

          {ADMIN_SECRET && logId && (
            <div style={{marginTop:20, padding:'12px', border:'1px solid #1e1e1e', borderRadius:4}}>
              <div style={{fontSize:10, fontWeight:500, letterSpacing:'0.12em', color:'#f87171', textTransform:'uppercase', marginBottom:10}}>admin · lobby</div>
              <div style={{display:'flex', flexWrap:'wrap', gap:8, alignItems:'center'}}>
                <button onClick={resetLobby}
                  style={{background:'transparent', border:'1px solid #2a2a2a', color:'#777', borderRadius:3, fontSize:11, padding:'4px 10px', cursor:'pointer'}}>
                  reset my votes
                </button>
                <label style={{display:'flex', alignItems:'center', gap:6, fontSize:11, color:'#555', cursor:'pointer'}}>
                  <input type="checkbox" checked={bypassTimeLimit} onChange={e => setBypassTimeLimit(e.target.checked)}
                    style={{accentColor:'#f87171'}}/>
                  bypass time limit
                </label>
                <label style={{display:'flex', alignItems:'center', gap:6, fontSize:11, color:'#555'}}>
                  window:
                  <input type="number" min="1" max="1440" value={timeLimitMin}
                    onChange={e => setTimeLimitMin(Math.max(1, parseInt(e.target.value)||30))}
                    style={{width:48, background:'#1a1a1a', border:'1px solid #2a2a2a', borderRadius:3,
                      color:'#e8e8e8', fontSize:11, padding:'2px 6px', fontFamily:'inherit'}}/>
                  min
                </label>
                {resetStatus && <span style={{fontSize:11, color:'#888'}}>{resetStatus}</span>}
              </div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
